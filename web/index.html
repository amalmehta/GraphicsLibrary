<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphics Library</title>
  <meta name="description" content="A C++ graphics library compiled to WebAssembly: a ray-traced black hole and a particle waterfall, running live in your browser.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="Graphics Library home">
      <img src="icon.svg" alt="" width="28" height="28">
      <span>Graphics Library</span>
    </a>
    <nav class="sims" id="sims" aria-label="Simulations"></nav>
    <div class="top-actions">
      <button class="icon-btn" id="settingsBtn" title="Settings (⌘,)" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9c-.6.3-1.2.6-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="canvas" tabindex="0" aria-label="Simulation view. Drag to orbit, scroll to zoom."></canvas>
        <div class="overlay-msg" id="message" hidden></div>
        <div class="hud hud-tl" id="fps" hidden></div>
        <div class="hud hud-bl">Drag to orbit · scroll to zoom</div>
        <div class="hud hud-br">
          <button class="chip-btn" id="pauseBtn" title="Pause (Space)">Pause</button>
          <button class="chip-btn" id="viewBtn" title="Reset view (R)">Reset view</button>
          <button class="chip-btn" id="simBtn" title="Restart simulation">Restart</button>
          <button class="chip-btn" id="fullBtn" title="Fullscreen (F)" aria-label="Fullscreen">⤢</button>
        </div>
      </div>
      <div class="caption" id="caption"></div>
    </section>

    <aside class="panel" id="panel" aria-label="Controls">
      <div class="panel-head">
        <h2 id="panelTitle">Controls</h2>
        <button class="link-btn" id="resetParams">Reset</button>
      </div>
      <div id="controls"></div>
      <details class="about" id="about">
        <summary>The physics</summary>
        <div id="aboutBody"></div>
      </details>
    </aside>
  </main>

  <a class="feedback-tab" id="feedback" href="#" target="_blank" rel="noopener">Feedback</a>

  <dialog class="settings" id="settings" aria-labelledby="settingsTitle">
    <form method="dialog">
      <div class="settings-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" value="close" aria-label="Close">✕</button>
      </div>
      <label class="row">
        <span>Quality</span>
        <select id="sQuality">
          <option value="0">Low</option>
          <option value="1">Medium</option>
          <option value="2">High</option>
        </select>
      </label>
      <label class="row">
        <span>Resolution <em id="sScaleOut"></em></span>
        <input type="range" id="sScale" min="0.4" max="1" step="0.05">
      </label>
      <label class="row check">
        <input type="checkbox" id="sAuto">
        <span>Lower resolution automatically when frames are slow</span>
      </label>
      <label class="row">
        <span>Pixel density</span>
        <select id="sDpr">
          <option value="1">Standard (1×)</option>
          <option value="1.5">Sharp (1.5×)</option>
          <option value="2">Retina (2×)</option>
        </select>
      </label>
      <label class="row">
        <span>Theme</span>
        <select id="sTheme">
          <option value="system">Match system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <label class="row check">
        <input type="checkbox" id="sFps">
        <span>Show frame rate</span>
      </label>
      <p class="fine">Shortcuts: Space pause · R reset view · F fullscreen · 1–2 switch simulation · ⌘, settings</p>
    </form>
  </dialog>

  <script src="engine.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
